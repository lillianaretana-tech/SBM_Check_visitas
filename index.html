roup,item].join('|'),value=visit.answers[key]||'';html+=`<div class="question"><div>${esc(item)}</div><select onchange="answer('${encodeURIComponent(key)}',this.value)"><option value="">Sin revisar</option>${['Cumple','No cumple','No aplica'].map(v=>`<option ${value===v?'selected':''}>${v}</option>`).join('')}</select></div>`}html+='</details>'}$('questions').innerHTML=html}function answer(encoded,value){const key=decodeURIComponent(encoded);if(value)visit.answers[key]=value;else delete visit.answers[key];saveDraft();if(value==='No cumple'&&confirm('¿Registrar hallazgo para este incumplimiento?')){let description=key.split('|').slice(2).join(' — ');addFinding(description)}}function addFinding(description=''){const text=prompt('Descripción del hallazgo:',description);if(text===null)return;visit.findings.push({id:crypto.randomUUID(),description:text,priority:'Media',action:'',owner:'',due:'',status:'Abierto',closure:''});saveDraft();renderFindings()}function renderFindings(){let html='<h2>Hallazgos</h2><button onclick="addFinding()">Agregar hallazgo</button>';visit.findings.forEach((f,i)=>{html+=`<div class="panel"><strong>${esc(f.description)}</strong><label>Prioridad</label><select onchange="finding(${i},'priority',this.value)">${['Baja','Media','Alta','Crítica'].map(v=>`<option ${f.priority===v?'selected':''}>${v}</option>`).join('')}</select><label>Acción correctiva</label><textarea onchange="finding(${i},'action',this.value)">${esc(f.action)}</textarea><label>Responsable</label><input value="${esc(f.owner)}" onchange="finding(${i},'owner',this.value)"><label>Fecha compromiso</label><input type="date" value="${esc(f.due)}" onchange="finding(${i},'due',this.value)"><label>Estado</label><select onchange="finding(${i},'status',this.value)">${['Abierto','En proceso','Resuelto'].map(v=>`<option ${f.status===v?'selected':''}>${v}</option>`).join('')}</select><label>Evidencia de cierre / referencia</label><textarea onchange="finding(${i},'closure',this.value)">${esc(f.closure)}</textarea></div>`});$('questions').innerHTML=html}function finding(i,key,value){visit.findings[i][key]=value;saveDraft()}async function closeVisit(){if(!visit)return;visit.status='cerrada';visit.closed=new Date().toISOString();let list=stored();list.push(visit);localStorage.setItem('sitecheck_visits',JSON.stringify(list));localStorage.removeItem('sitecheck_draft');visit=null;$('workspace').classList.add('hidden');historyView();const ok=await sync();alert(ok?'Visita cerrada y sincronizada.':'Visita guardada localmente. Sincronización pendiente: revisa el aviso de conexión.') }function historyView(){const merged=[...new Map([...remoteVisits,...stored()].map(v=>[v.id,v])).values()];$('history').innerHTML=merged.slice().reverse().map(v=>`<p><strong>${esc(v.site)}</strong> · ${new Date(v.started).toLocaleString('es-CR')} · ${Object.keys(v.answers).length} respuestas · ${v.findings.length} hallazgos</p>`).join('')||'<p class="muted">Sin visitas cerradas todavía.</p>'}async function exportXLSX(){
 const records=[...new Map([...remoteVisits,...stored()].map(v=>[v.id,v])).values()];

 try{

   const header=ws.getRow(5);headers.forEach((h,i)=>{const x=header.getCell(i+1);x.value=h;x.font={bold:true,color:{argb:white},size:10};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:blue}};x.alignment={vertical:'middle',wrapText:true}});header.height=32;

   summary.push([v.site,stamp(v.started),stamp(v.closed),v.floor||'',v.location||'',entries.length,counts.Cumple,counts['No cumple'],counts['No aplica'],f.length,f.filter(x=>x.status!=='Resuelto').length,v.status||'cerrada']);
   for(const [key,value] of entries){const a=key.split('|');const line=[v.site,stamp(v.started),a[1]||'',v.location||'',a[2]||'',a.slice(3).join(' | '),value];(a[0]==='calidad'?quality:operational).push(line)}
   for(const x of f)findings.push([v.site,stamp(v.started),v.floor||'',v.location||'',x.description||'',x.priority||'',x.owner||'',x.action||'',x.due||'',x.status||'',x.closure||'']);

const SITE_IDS={'McKenzie':'mck','Emerson':'emerson','Uber COE':'uber_coe','Uber Bambú':'uber_bambu','Uber Cedral':'uber_cedral','DXC':'dxc','LSEG':'lseg','World Place':'world_place','Advant':'advant'};
const SITE_NAMES=Object.fromEntries(Object.entries(SITE_IDS).map(([k,v])=>[v,k]));
const RES={'Cumple':'pass','No cumple':'fail','No aplica':'na'},RES_INV={pass:'Cumple',fail:'No cumple',na:'No aplica'};
const PRI={'Baja':'low','Media':'medium','Alta':'high','Crítica':'critical'},PRI_INV={low:'Baja',medium:'Media',high:'Alta',critical:'Crítica'};
const ST={'Abierto':'open','En proceso':'in_progress','Resuelto':'closed'},ST_INV={open:'Abierto',in_progress:'En proceso',closed:'Resuelto'};
function access(user,message){sessionUser=user||null;$('loginForm').classList.toggle('hidden',!!user);$('signedIn').classList.toggle('hidden',!user);$('connection').textContent=message||(user?'Sesión activa: '+user.email:'Inicia sesión para comenzar.');}
async function initAuth(){try{if(!window.supabase)throw Error('No se pudo cargar Supabase');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{user}}=await db.auth.getUser();access(user);if(user)await loadRemote();db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){remoteVisits=[];access(null);historyView()}else if(session?.user&&!sessionUser)access(session.user)});}catch(e){access(null,'Conexión no disponible: '+e.message)}}
async function connect(){try{if(!db)throw Error('No hay conexión');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';access(data.user);await loadRemote();await sync();}catch(e){alert('No se pudo iniciar sesión: '+e.message)}}
async function logout(){if(db)await db.auth.signOut();remoteVisits=[];access(null);historyView()}
async function sync(){if(!sessionUser||!db){alert('Inicia sesión primero');return false}try{for(const v of stored()){
const site_id=SITE_IDS[v.site];if(!site_id)throw Error('Proyecto desconocido');
let {error}=await db.from('sitecheck_visits').upsert({id:v.id,owner_id:sessionUser.id,site_id,started_at:v.started,ended_at:v.closed||null,status:'closed',notes:JSON.stringify({floor:v.floor||'',location:v.location||''})},{onConflict:'id'});if(error)throw error;

const checks=Object.entries(v.answers||{}).map(([key,result])=>{const [module,level,area,...items]=key.split('|');return {owner_id:sessionUser.id,visit_id:v.id,module:module==='calidad'?'quality':'operational',level,area,item:items.join('|'),result:RES[result]||'na'}});
if(checks.length){const {error:e}=await db.from('sitecheck_checks').insert(checks);if(e)throw e}
